# Pile de production TransfertPlus (un hôte). PostgreSQL est géré (Supabase,
# TLS vérifié) et n'apparaît donc pas ici.
#
#   docker compose -f deploy/compose.production.yaml --env-file deploy/env/edge.env run --rm migrate
#   docker compose -f deploy/compose.production.yaml --env-file deploy/env/edge.env up -d
#
# Images : ghcr.io/amadou2-ops/transfertplus-<composant>:<version> (workflow
# platform-release), référencées par empreinte en production (TP_IMAGE_*).
#
# Durcissement appliqué à chaque service applicatif : système de fichiers en
# lecture seule, aucune capacité Linux, pas d'élévation de privilèges,
# utilisateur non privilégié, limites mémoire, processeur et nombre de
# processus (deploy.resources.limits), journaux bornés.
name: transfertplus

x-hardened: &hardened
  read_only: true
  user: "65532:65532"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  tmpfs:
    - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?}
      API_DOMAIN: ${API_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
      ADMIN_ALLOWED_CIDRS: ${ADMIN_ALLOWED_CIDRS:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
      admin: { condition: service_healthy }
    networks: [edge]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  api:
    <<: *hardened
    image: ${TP_IMAGE_API:-ghcr.io/amadou2-ops/transfertplus-api:latest}
    env_file: [env/api.env, env/api.secrets.env]
    secrets:
      - source: supabase-ca
        target: /run/secrets/supabase-ca.crt
      - source: tsa-ca
        target: /run/secrets/tsa-ca.pem
    deploy:
      replicas: 2
      resources:
        limits: { memory: 768M, cpus: "1.5", pids: 256 }
    depends_on:
      redis: { condition: service_healthy }
    networks: [edge, backend]

  worker:
    <<: *hardened
    image: ${TP_IMAGE_API:-ghcr.io/amadou2-ops/transfertplus-api:latest}
    command: ["dist/worker.js"]
    # Le worker n'expose pas de port HTTP : pas de sonde de santé applicative.
    healthcheck: { disable: true }
    env_file: [env/api.env, env/api.secrets.env]
    secrets:
      - source: supabase-ca
        target: /run/secrets/supabase-ca.crt
      - source: tsa-ca
        target: /run/secrets/tsa-ca.pem
    deploy:
      replicas: 1
      resources:
        limits: { memory: 768M, cpus: "1", pids: 256 }
    depends_on:
      redis: { condition: service_healthy }
    networks: [backend, egress]

  web:
    <<: *hardened
    image: ${TP_IMAGE_WEB:-ghcr.io/amadou2-ops/transfertplus-web:latest}
    env_file: [env/web.env, env/web.secrets.env]
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      - /app/apps/web/.next/cache:size=128m,uid=65532,gid=65532
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1", pids: 256 }
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]

  admin:
    <<: *hardened
    image: ${TP_IMAGE_ADMIN:-ghcr.io/amadou2-ops/transfertplus-admin:latest}
    env_file: [env/admin.env, env/admin.secrets.env]
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      - /app/apps/admin/.next/cache:size=64m,uid=65532,gid=65532
    deploy:
      resources:
        limits: { memory: 384M, cpus: "0.5", pids: 256 }
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes", "--protected-mode", "yes", "--rename-command", "FLUSHALL", "", "--rename-command", "FLUSHDB", "", "--rename-command", "CONFIG", ""]
    user: "999:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    networks: [backend]

  # Tâche ponctuelle : migrations puis contrôle d'intégrité, avant tout déploiement.
  migrate:
    <<: *hardened
    image: ${TP_IMAGE_MIGRATE:-ghcr.io/amadou2-ops/transfertplus-migrate:latest}
    restart: "no"
    profiles: [migrate]
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1", pids: 128 }
    env_file: [env/migrate.env]
    secrets:
      - source: supabase-ca
        target: /run/secrets/supabase-ca.crt
    networks: [egress]

networks:
  # Trafic public entrant (Caddy) et appels des BFF vers l'API.
  edge: {}
  # Redis : aucun accès à Internet.
  backend:
    internal: true
  # Sorties vers les prestataires et la base gérée.
  egress: {}

volumes:
  caddy-data:
  caddy-config:
  redis-data:

secrets:
  supabase-ca:
    file: ./secrets/supabase-ca.crt
  tsa-ca:
    file: ./secrets/tsa-ca.pem
