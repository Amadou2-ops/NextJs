openapi: 3.1.0
info:
  title: TransfertPlus API
  version: 0.1.0
  description: |
    API unique servant l'application mobile (Flutter), le site web client et le
    dashboard d'administration (Next.js).

    Conventions non négociables :
    - Montants : chaînes d'entiers en unités mineures de la devise
      (`"10000"` EUR = 100,00 €). Jamais de nombre décimal.
    - Toute requête mutatrice exige l'en-tête `Idempotency-Key` (16 à 128
      caractères `[A-Za-z0-9_-]`).
    - Erreurs au format RFC 9457 (`application/problem+json`) avec un `code`
      métier stable.

    Ce document est complété module par module (authentification, registre,
    change, KYC, transferts, AML, administration) selon la feuille de route.
servers:
  - url: https://api.transfertplus.example/v1
    description: Production
  - url: https://api.staging.transfertplus.example/v1
    description: Staging (sandbox prestataires)
security:
  - mobileBearer: []
  - webSession: []
tags:
  - name: system
  - name: auth
    description: Inscription, connexion, sessions, appareils, double authentification
  - name: wallets
    description: Portefeuilles et relevés du client
  - name: admin-ledger
    description: Registre côté personnel (consultation ; gel, ajustement, contre-passation en double validation)
  - name: admin-auth
    description: Enrôlement et connexion du personnel (mot de passe + clé WebAuthn matérielle)
  - name: admin-customers
    description: Fiches clients, données personnelles tracées, suspension
  - name: admin-transfers
    description: Revue des transferts, mise en revue, libération, remboursement ordonné
  - name: admin-kyc
    description: Revue manuelle des vérifications d'identité
  - name: admin-aml
    description: Alertes, dossiers d'enquête, déclarations de soupçon
  - name: admin-approvals
    description: Double validation (règle des quatre yeux)
  - name: admin-staff
    description: Personnel, rôles et réseaux autorisés
  - name: admin-audit
    description: Journal d'audit chaîné
  - name: fx
    description: Simulation de transfert et devis garantis (taux, frais, montant reçu)
  - name: kyc
    description: Vérification d'identité (niveaux, sessions de capture Onfido / Smile ID)
  - name: recipients
    description: Bénéficiaires du client (coordonnées chiffrées)
  - name: transfers
    description: Transferts, financement, suivi et annulation
  - name: webhooks
    description: Notifications signées des prestataires (jamais appelées par les clients)
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: État de santé (sans authentification)
      security: []
      responses:
        "200":
          description: Service opérationnel
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, version]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  version:
                    type: string
        "503":
          $ref: "#/components/responses/Problem"
  /.well-known/jwks.json:
    get:
      tags: [system]
      operationId: getJwks
      summary: Clés publiques de vérification des jetons d'accès (EdDSA)
      security: []
      responses:
        "200":
          description: Jeu de clés JWK publiques
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"
  /auth/device-challenges:
    post:
      tags: [auth]
      operationId: createDeviceChallenge
      summary: Défi serveur à intégrer à l'attestation d'un nouvel appareil mobile
      security: []
      responses:
        "201":
          description: Défi à usage unique (5 minutes)
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, challenge, expiresAt]
                properties:
                  challengeId: { type: string, format: uuid }
                  challenge: { type: string, description: "32 octets en base64url" }
                  expiresAt: { type: string, format: date-time }
        "429":
          $ref: "#/components/responses/Problem"
  /auth/registration/start:
    post:
      tags: [auth]
      operationId: startRegistration
      summary: Envoie un code SMS au numéro (réponse identique si le numéro est déjà inscrit)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, example: "+221 77 123 45 67" }
                countryHint: { $ref: "#/components/schemas/CountryCode" }
                locale: { type: string, default: fr }
      responses:
        "202":
          description: Code envoyé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationChallenge"
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /auth/registration/complete:
    post:
      tags: [auth]
      operationId: completeRegistration
      summary: Vérifie le code SMS, crée le compte et ouvre une session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, code, phone, password, countryOfResidence, client]
              properties:
                challengeId: { type: string, format: uuid }
                code: { $ref: "#/components/schemas/OtpCode" }
                phone: { type: string }
                password: { type: string, minLength: 10, maxLength: 128 }
                countryOfResidence: { $ref: "#/components/schemas/CountryCode" }
                preferredLocale: { type: string, default: fr }
                client: { $ref: "#/components/schemas/ClientDescriptor" }
      responses:
        "201":
          description: Compte créé, session ouverte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticatedSession" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /auth/login:
    post:
      tags: [auth]
      operationId: startLogin
      summary: Vérifie le mot de passe ; connexion directe sur appareil de confiance signé, sinon second facteur
      description: |
        Appareil mobile déjà enregistré (`client.deviceId`) : la requête DOIT
        porter les en-têtes de signature d'appareil.
      security: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/DeviceSignature"
        - $ref: "#/components/parameters/DeviceSignatureTimestamp"
        - $ref: "#/components/parameters/DeviceCounter"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, password, client]
              properties:
                phone: { type: string }
                password: { type: string }
                client: { $ref: "#/components/schemas/ClientDescriptor" }
      responses:
        "200":
          description: Session ouverte ou second facteur requis
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticatedSession"
                  - $ref: "#/components/schemas/SecondFactorRequired"
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "423": { $ref: "#/components/responses/Problem" }
  /auth/login/verify:
    post:
      tags: [auth]
      operationId: completeLogin
      summary: Valide le second facteur (code SMS ou TOTP)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [loginChallengeId, code]
              properties:
                loginChallengeId: { type: string, format: uuid }
                code: { $ref: "#/components/schemas/OtpCode" }
      responses:
        "200":
          description: Session ouverte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticatedSession" }
        "410": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "423": { $ref: "#/components/responses/Problem" }
  /auth/token/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Échange un jeton de renouvellement (usage unique, rotation)
      description: |
        Session mobile : la requête DOIT être signée par l'appareil. La
        réutilisation d'un jeton déjà échangé révoque toute la session.
      security: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/DeviceSignature"
        - $ref: "#/components/parameters/DeviceSignatureTimestamp"
        - $ref: "#/components/parameters/DeviceCounter"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string, pattern: "^rt_[A-Za-z0-9_-]{43}$" }
      responses:
        "200":
          description: Nouveaux jetons
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticatedSession" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Révoque la session courante
      responses:
        "204": { description: Session révoquée }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      summary: Sessions actives du client
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/SessionSummary" }
  /auth/sessions/{sessionId}:
    delete:
      tags: [auth]
      operationId: revokeSession
      summary: Révoque une session (niveau d'assurance 2 requis)
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Session révoquée }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /auth/sessions/revoke-others:
    post:
      tags: [auth]
      operationId: revokeOtherSessions
      summary: Révoque toutes les autres sessions
      responses:
        "200":
          description: Nombre de sessions révoquées
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, minimum: 0 }
  /auth/devices:
    get:
      tags: [auth]
      operationId: listDevices
      summary: Appareils de confiance du client
      responses:
        "200":
          description: Appareils
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceSummary" }
  /auth/devices/{deviceId}:
    delete:
      tags: [auth]
      operationId: revokeDevice
      summary: Révoque un appareil et toutes ses sessions
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Appareil révoqué }
        "404": { $ref: "#/components/responses/Problem" }
  /auth/mfa/totp/setup:
    post:
      tags: [auth]
      operationId: startTotpEnrollment
      summary: Génère un secret TOTP (actif après confirmation)
      responses:
        "201":
          description: Secret à scanner
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUri]
                properties:
                  secret: { type: string, description: "Base32" }
                  otpauthUri: { type: string }
        "409": { $ref: "#/components/responses/Problem" }
  /auth/mfa/totp/confirm:
    post:
      tags: [auth]
      operationId: confirmTotpEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCodeRequest" }
      responses:
        "204": { description: Double authentification activée }
        "422": { $ref: "#/components/responses/Problem" }
  /auth/mfa/totp/disable:
    post:
      tags: [auth]
      operationId: disableTotp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCodeRequest" }
      responses:
        "204": { description: Double authentification désactivée }
        "422": { $ref: "#/components/responses/Problem" }
  /auth/passkeys/registration/options:
    post:
      tags: [auth]
      operationId: passkeyRegistrationOptions
      summary: Options WebAuthn d'enregistrement (session web, niveau 2)
      responses:
        "201":
          description: Options PublicKeyCredentialCreationOptionsJSON
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, options]
                properties:
                  challengeId: { type: string, format: uuid }
                  options: { type: object }
  /auth/passkeys/registration/verify:
    post:
      tags: [auth]
      operationId: passkeyRegistrationVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, response]
              properties:
                challengeId: { type: string, format: uuid }
                nickname: { type: string, maxLength: 60 }
                response: { type: object, description: "RegistrationResponseJSON" }
      responses:
        "201":
          description: Passkey enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [credentialId]
                properties:
                  credentialId: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/passkeys/authentication/options:
    post:
      tags: [auth]
      operationId: passkeyAuthenticationOptions
      security: []
      responses:
        "201":
          description: Options PublicKeyCredentialRequestOptionsJSON
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, options]
                properties:
                  challengeId: { type: string, format: uuid }
                  options: { type: object }
  /auth/passkeys/authentication/verify:
    post:
      tags: [auth]
      operationId: passkeyAuthenticationVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, response]
              properties:
                challengeId: { type: string, format: uuid }
                response: { type: object, description: "AuthenticationResponseJSON" }
      responses:
        "200":
          description: Session web ouverte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticatedSession" }
        "401": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
  /wallets:
    get:
      tags: [wallets]
      operationId: listWallets
      summary: Soldes disponibles et réservés par devise
      responses:
        "200":
          description: Portefeuilles du client
          content:
            application/json:
              schema:
                type: object
                required: [wallets]
                properties:
                  wallets:
                    type: array
                    items: { $ref: "#/components/schemas/Wallet" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [wallets]
      operationId: openWallet
      summary: Ouvre (idempotent) un portefeuille dans une devise proposée
      description: "Session mobile : requête signée par l'appareil."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currency]
              properties:
                currency: { $ref: "#/components/schemas/CurrencyCode" }
      responses:
        "201":
          description: Portefeuille ouvert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "422": { $ref: "#/components/responses/Problem" }
  /wallets/{currency}/statement:
    get:
      tags: [wallets]
      operationId: walletStatement
      summary: Relevé du portefeuille, du plus récent au plus ancien
      parameters:
        - { name: currency, in: path, required: true, schema: { $ref: "#/components/schemas/CurrencyCode" } }
        - { name: before, in: query, required: false, description: "Curseur nextCursor de la page précédente", schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Écritures du portefeuille
          content:
            application/json:
              schema:
                type: object
                required: [entries, nextCursor]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/StatementEntry" }
                  nextCursor: { type: [string, "null"] }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/ledger/accounts/{accountId}:
    get:
      tags: [admin-ledger]
      operationId: adminGetLedgerAccount
      summary: Compte du registre et son solde (permission ledger:read)
      security:
        - adminBearer: []
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Compte, content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/ledger/accounts/{accountId}/entries:
    get:
      tags: [admin-ledger]
      operationId: adminListLedgerEntries
      security:
        - adminBearer: []
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: before, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Écritures, content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /admin/ledger/journals/{journalId}:
    get:
      tags: [admin-ledger]
      operationId: adminGetLedgerJournal
      summary: Journal, empreintes chaînées et écritures
      security:
        - adminBearer: []
      parameters:
        - { name: journalId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Journal, content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/ledger/trial-balance:
    get:
      tags: [admin-ledger]
      operationId: adminTrialBalance
      summary: Balance générale par devise
      security:
        - adminBearer: []
      responses:
        "200": { description: Balance générale, content: { application/json: { schema: { type: object } } } }
  /admin/ledger/integrity:
    get:
      tags: [admin-ledger]
      operationId: adminLedgerIntegrity
      summary: Tête de chaîne, dernier rapprochement et dernier ancrage externe
      security:
        - adminBearer: []
      responses:
        "200": { description: État d'intégrité, content: { application/json: { schema: { type: object } } } }
  /fx/estimate:
    get:
      tags: [fx]
      operationId: estimateTransfer
      summary: Simulation publique d'un transfert (calculateur du site web)
      description: |
        Non authentifiée, limitée par adresse IP. Le résultat n'engage pas :
        seul un devis (`POST /quotes`) fige le taux et les frais.
      security: []
      parameters:
        - { name: sourceCountry, in: query, required: true, schema: { $ref: "#/components/schemas/CountryCode" } }
        - { name: destinationCountry, in: query, required: true, schema: { $ref: "#/components/schemas/CountryCode" } }
        - { name: sourceCurrency, in: query, required: true, schema: { $ref: "#/components/schemas/CurrencyCode" } }
        - { name: destinationCurrency, in: query, required: true, schema: { $ref: "#/components/schemas/CurrencyCode" } }
        - { name: payoutMethod, in: query, required: true, schema: { $ref: "#/components/schemas/PayoutMethod" } }
        - { name: fundingMethod, in: query, required: false, schema: { $ref: "#/components/schemas/FundingMethod" } }
        - { name: amount, in: query, required: true, schema: { $ref: "#/components/schemas/PositiveMinorUnits" } }
        - { name: amountType, in: query, required: false, schema: { $ref: "#/components/schemas/AmountType" } }
      responses:
        "200":
          description: Simulation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /quotes:
    post:
      tags: [fx]
      operationId: createQuote
      summary: Devis garanti pour le client connecté
      description: |
        Le pays d'envoi est le pays de résidence du client. Le devis fige le
        taux, la marge, les frais et le mode de financement ; il est valable
        `expiresAt` et ne peut être consommé que par un seul transfert.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequest" }
      responses:
        "201":
          description: Devis enregistré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /quotes/{quoteId}:
    get:
      tags: [fx]
      operationId: getQuote
      summary: Consultation d'un devis du client
      parameters:
        - { name: quoteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Devis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Quote"
                  - type: object
                    required: [consumed]
                    properties:
                      consumed: { type: boolean }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /kyc:
    get:
      tags: [kyc]
      operationId: getKycOverview
      summary: Niveau KYC, plafonds associés et vérifications du client
      responses:
        "200":
          description: Situation KYC
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycOverview" }
        "401": { $ref: "#/components/responses/Problem" }
  /kyc/verifications:
    post:
      tags: [kyc]
      operationId: startKycVerification
      summary: Ouvre une session de capture chez le prestataire choisi pour le pays de résidence
      description: |
        Session mobile : requête signée par l'appareil. L'identité déclarée
        (telle qu'elle figure sur la pièce) est exigée à la première
        vérification et figée ensuite. Relancer l'ouverture remplace une
        session non terminée. Niveau 3 : vigilance renforcée, décidée par la
        conformité (pas en libre-service).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartKycVerificationRequest" }
      responses:
        "201":
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [verification, launch]
                properties:
                  verification: { $ref: "#/components/schemas/KycVerification" }
                  launch: { $ref: "#/components/schemas/KycSdkLaunch" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /kyc/verifications/{verificationId}:
    get:
      tags: [kyc]
      operationId: getKycVerification
      summary: État d'une vérification du client
      parameters:
        - { name: verificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Vérification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycVerification" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /kyc/verifications/{verificationId}/submitted:
    post:
      tags: [kyc]
      operationId: markKycVerificationSubmitted
      summary: Signale la fin de la capture dans le SDK (indicatif, la décision vient du prestataire)
      description: "Session mobile : requête signée par l'appareil."
      parameters:
        - { name: verificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Vérification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycVerification" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /webhooks/onfido:
    post:
      tags: [webhooks]
      operationId: onfidoWebhook
      summary: Événements Onfido (workflow_run.completed)
      description: |
        Authentification : en-tête `X-SHA2-Signature` = hex(HMAC-SHA256(jeton
        du webhook, corps brut)). Le résultat est ensuite relu auprès d'Onfido.
      security: []
      parameters:
        - { name: X-SHA2-Signature, in: header, required: true, schema: { type: string, pattern: "^[0-9a-fA-F]{64}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { $ref: "#/components/responses/WebhookReceived" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /webhooks/smile-id:
    post:
      tags: [webhooks]
      operationId: smileIdWebhook
      summary: Rappels de résultat Smile ID
      description: |
        Authentification : champs `signature` et `timestamp` du corps (schéma
        de signature Smile ID), horodatage dans la fenêtre de tolérance. Le
        résultat est ensuite relu par job_status.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [signature, timestamp, PartnerParams] }
      responses:
        "200": { $ref: "#/components/responses/WebhookReceived" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /recipients:
    get:
      tags: [recipients]
      operationId: listRecipients
      summary: Bénéficiaires actifs du client
      responses:
        "200":
          description: Bénéficiaires
          content:
            application/json:
              schema:
                type: object
                required: [recipients]
                properties:
                  recipients:
                    type: array
                    items: { $ref: "#/components/schemas/Recipient" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [recipients]
      operationId: createRecipient
      summary: Enregistre un bénéficiaire (coordonnées chiffrées, jamais modifiées ensuite)
      description: "Session mobile : requête signée par l'appareil."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRecipientRequest" }
      responses:
        "201":
          description: Bénéficiaire enregistré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipient" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /recipients/{recipientId}:
    delete:
      tags: [recipients]
      operationId: archiveRecipient
      summary: Archive un bénéficiaire (l'historique des transferts est conservé)
      parameters:
        - { name: recipientId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Bénéficiaire archivé }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /transfers:
    get:
      tags: [transfers]
      operationId: listTransfers
      summary: Transferts du client, du plus récent au plus ancien
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: before, in: query, required: false, description: "Curseur nextCursor de la page précédente", schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Transferts
          content:
            application/json:
              schema:
                type: object
                required: [transfers, nextCursor]
                properties:
                  transfers:
                    type: array
                    items: { $ref: "#/components/schemas/Transfer" }
                  nextCursor: { type: [string, "null"], format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [transfers]
      operationId: createTransfer
      summary: Crée un transfert à partir d'un devis garanti
      description: |
        En-tête Idempotency-Key obligatoire (rejeu : même transfert, statut
        200). Autorisation renforcée : session mobile signée par l'appareil,
        ou code TOTP (`totpCode`) pour une session web. Financement par le
        portefeuille : réservation immédiate. Financement externe : la
        réponse contient l'action de paiement (`funding`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTransferRequest" }
      responses:
        "200":
          description: Requête rejouée (même transfert)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedTransfer" }
        "201":
          description: Transfert créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedTransfer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /transfers/{transferId}:
    get:
      tags: [transfers]
      operationId: getTransfer
      summary: Détail d'un transfert et historique des statuts
      parameters:
        - { name: transferId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Transfert
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Transfer"
                  - type: object
                    required: [history]
                    properties:
                      history:
                        type: array
                        items:
                          type: object
                          required: [status, at]
                          properties:
                            status: { $ref: "#/components/schemas/TransferStatus" }
                            at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /transfers/{transferId}/funding:
    get:
      tags: [transfers]
      operationId: getTransferFunding
      summary: Action de paiement à jour pour un transfert en attente de financement
      parameters:
        - { name: transferId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Action de paiement
          content:
            application/json:
              schema:
                type: object
                required: [funding]
                properties:
                  funding: { $ref: "#/components/schemas/FundingAction" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /transfers/{transferId}/cancel:
    post:
      tags: [transfers]
      operationId: cancelTransfer
      summary: Annule un transfert non encore payé au bénéficiaire (remboursement si déjà financé)
      description: "Session mobile : requête signée par l'appareil."
      parameters:
        - { name: transferId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Transfert annulé ou remboursé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /webhooks/stripe:
    post:
      tags: [webhooks]
      operationId: stripeWebhook
      summary: Événements Stripe (PaymentIntent, remboursements, litiges)
      description: "En-tête Stripe-Signature (t=…,v1=HMAC-SHA256), tolérance 5 minutes."
      security: []
      parameters:
        - { name: Stripe-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { $ref: "#/components/responses/WebhookReceived" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /webhooks/flutterwave:
    post:
      tags: [webhooks]
      operationId: flutterwaveWebhook
      summary: Événements Flutterwave (charge.completed, transfer.completed)
      description: "En-tête verif-hash (secret partagé) ; l'état est relu chez Flutterwave."
      security: []
      parameters:
        - { name: verif-hash, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { $ref: "#/components/responses/WebhookReceived" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /webhooks/thunes:
    post:
      tags: [webhooks]
      operationId: thunesWebhook
      summary: Rappels de statut Thunes
      description: "Liste blanche d'adresses facultative ; la transaction est toujours relue chez Thunes."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [external_id] }
      responses:
        "200": { $ref: "#/components/responses/WebhookReceived" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /admin/auth/enrollment/options:
    post:
      tags: [admin-auth]
      operationId: adminEnrollmentOptions
      summary: Options WebAuthn d'enrôlement (invitation à usage unique)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invitationToken]
              properties:
                invitationToken: { type: string, pattern: "^inv_[A-Za-z0-9_-]{43}$" }
      responses:
        "200": { description: "Défi et options de création de clé", content: { application/json: { schema: { type: object } } } }
  /admin/auth/enrollment/complete:
    post:
      tags: [admin-auth]
      operationId: adminEnrollmentComplete
      summary: "Activation du compte : mot de passe (14 caractères minimum) et clé matérielle"
      description: |
        Les passkeys synchronisées (drapeau BE) sont refusées : la clé doit rester liée
        à un authentificateur physique. Le jeton d'invitation est consommé.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invitationToken, challengeId, password, response]
              properties:
                invitationToken: { type: string }
                challengeId: { type: string, format: uuid }
                password: { type: string, minLength: 14, maxLength: 128 }
                nickname: { type: string, maxLength: 60 }
                response: { type: object, description: "Réponse WebAuthn du navigateur (PublicKeyCredential JSON)" }
      responses:
        "201": { description: "Compte activé", content: { application/json: { schema: { type: object } } } }
  /admin/auth/login:
    post:
      tags: [admin-auth]
      operationId: adminLogin
      summary: "Connexion, étape 1 : mot de passe (réseau autorisé, verrouillage après 5 échecs)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 128 }
      responses:
        "200": { description: "Défi WebAuthn lié au compte et à l'adresse IP", content: { application/json: { schema: { type: object } } } }
  /admin/auth/login/verify:
    post:
      tags: [admin-auth]
      operationId: adminLoginVerify
      summary: "Connexion, étape 2 : assertion de la clé matérielle"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, response]
              properties:
                challengeId: { type: string, format: uuid }
                response: { type: object, description: "Réponse WebAuthn du navigateur (PublicKeyCredential JSON)" }
      responses:
        "200": { description: "Session ouverte", content: { application/json: { schema: { $ref: "#/components/schemas/AdminTokens" } } } }
  /admin/auth/token/refresh:
    post:
      tags: [admin-auth]
      operationId: adminTokenRefresh
      summary: Renouvellement (jeton à usage unique ; réutilisation = session révoquée)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string, pattern: "^art_[A-Za-z0-9_-]{43}$" }
      responses:
        "200": { description: "Nouveaux jetons", content: { application/json: { schema: { $ref: "#/components/schemas/AdminTokens" } } } }
  /admin/auth/logout:
    post:
      tags: [admin-auth]
      operationId: adminLogout
      summary: Déconnexion (session révoquée)
      security:
        - adminBearer: []
      responses:
        "204": { description: Session fermée }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/me:
    get:
      tags: [admin-auth]
      operationId: adminMe
      summary: Profil, rôles et permissions effectives
      security:
        - adminBearer: []
      responses:
        "200": { description: "Résultat", content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/customers:
    get:
      tags: [admin-customers]
      operationId: adminSearchCustomers
      summary: Recherche exacte (numéro client, identifiant, téléphone E.164, e-mail)
      description: |
        customers:read. Aucune donnée personnelle en clair dans la réponse.
      security:
        - adminBearer: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 254 } }
        - { name: status, in: query, schema: { type: string, enum: [pending_verification, active, suspended, closed] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: "Résultat", content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/customers/{id}:
    get:
      tags: [admin-customers]
      operationId: adminCustomerDetail
      summary: "Fiche client : KYC, profil de risque, soldes, alertes, dossiers"
      security:
        - adminBearer: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "Résultat", content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/customers/{id}/pii:
    post:
      tags: [admin-customers]
      operationId: adminRevealCustomerPii
      summary: Données personnelles déchiffrées (customers:read_pii, tracé)
      security:
        - adminBearer: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [justification]
              properties:
                justification: { type: string, minLength: 10, maxLength: 1000, description: "Justification consignée dans la demande et le journal daudit" }
      responses:
        "200": { description: "Résultat", content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/customers/{id}/status:
    post:
      tags: [admin-customers]
      operationId: adminSetCustomerStatus
      summary: Suspension (sessions révoquées) ou rétablissement (customers:suspend)
      security:
        - adminBearer: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason]
              properties:
                status: { type: string, enum: [suspended, active] }
                reason: { type: string, minLength: 10, maxLength: 1000, description: "Justification consignée dans la demande et le journal daudit" }
      responses:
        "200": { description: "Résultat", content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/transfers:
    get:
      tags: [admin-transfers]
      operationId: adminListTransfers
      summary: File des transferts (transfers:read)
      security:
        - adminBearer: []
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TransferStatus" } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: reference, in: query, schema: { type: string } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: "Résultat", content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/transfers/{id}:
    get:
      tags: [admin-transfers]
      operationId: adminTransferDetail
      summary: "Détail : historique, tentatives, écritures, alertes, évaluation AML"
      security:
        - adminBearer: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "Résultat", content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/transfers/{id}/hold:
    post:
      tags: [admin-transfers]
      operationId: adminHoldTransfer
      summary: Mise en revue manuelle (transfers:hold) avant tout paiement sortant
      security:
        - adminBearer: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 1000, description: "Justification consignée dans la demande et le journal daudit" }
      responses:
        "200": { description: "Résultat", content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/transfers/{id}/release:
    post:
      tags: [admin-transfers]
      operationId: adminReleaseTransfer
      summary: Libération après levée humaine des alertes bloquantes (transfers:release)
      security:
        - adminBearer: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note]
              properties:
                note: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        "200": { description: "Résultat", content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/transfers/{id}/refund-requests:
    post:
      tags: [admin-transfers]
      operationId: adminRequestTransferRefund
      summary: Demande de remboursement ordonné (double validation, transfers:refund)
      security:
        - adminBearer: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, justification]
              properties:
                reason: { type: string, minLength: 10, maxLength: 1000, description: "Justification consignée dans la demande et le journal daudit" }
                justification: { type: string, minLength: 10, maxLength: 1000, description: "Justification consignée dans la demande et le journal daudit" }
      responses:
        "202": { description: "Demande en attente d'un second membre", content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/kyc/reviews:
    get:
      tags: [admin-kyc]
      operationId: adminKycQueue
      summary: File de revue manuelle (kyc:read)
      security:
        - adminBearer: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: "Résultat", content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/kyc/verifications/{id}:
    get:
      tags: [admin-kyc]
      operationId: adminKycDetail
      summary: Vérification, preuve d'identité et historique
      security:
        - adminBearer: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: reveal, in: query, schema: { type: string, enum: [identity] }, description: "Déchiffre la pièce (customers:read_pii, tracé)" }
      responses:
        "200": { description: "Résultat", content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/kyc/verifications/{id}/decision:
    post:
      tags: [admin-kyc]
      operationId: adminKycDecision
      summary: Décision manuelle (kyc:decide) ; le niveau est relevé par la base
      security:
        - adminBearer: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, note]
              properties:
                decision: { type: string, enum: [approve, reject, resubmission_required] }
                reasons: { type: array, maxItems: 10, items: { type: string, pattern: "^[a-z][a-z0-9_]{2,63}$" } }
                note: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        "200": { description: "Résultat", content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/aml/alerts:
    get:
      tags: [admin-aml]
      operationId: adminListAlerts
      summary: Alertes ouvertes par sévérité (aml:alerts:read)
      security:
