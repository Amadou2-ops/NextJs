        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    mobileBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Jeton d'accès EdDSA de 10 minutes, `aud=mobile`, lié à la session
        (`sid`) et à la clé de l'appareil. Les requêtes sensibles portent en
        plus l'en-tête `X-Device-Signature`.
    webSession:
      type: apiKey
      in: cookie
      name: __Host-sid
      description: |
        Session du site web client, détenue par le serveur intermédiaire
        Next.js (BFF). Le navigateur n'a jamais accès au jeton d'accès.
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Jeton d'accès du personnel (EdDSA, 10 minutes, `aud=admin`, clés de
        signature distinctes des clients), obtenu par mot de passe + clé
        WebAuthn matérielle et détenu par le serveur du dashboard (BFF).
        Chaque requête vérifie aussi la session, le réseau autorisé du
        membre et sa permission.
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
    DeviceSignature:
      name: X-Device-Signature
      in: header
      required: false
      description: |
        Signature base64url (ES256 au format DER, ou EdDSA) du message UTF-8 :
        "TPv1\n" + MÉTHODE + "\n" + chemin?requête + "\n" + horodatage + "\n"
        + compteur + "\n" + base64url(SHA-256(corps brut)).
      schema: { type: string }
    DeviceSignatureTimestamp:
      name: X-Device-Signature-Timestamp
      in: header
      required: false
      description: Horodatage Unix en millisecondes (tolérance ±60 s).
      schema: { type: string, pattern: "^[0-9]{13}$" }
    DeviceCounter:
      name: X-Device-Counter
      in: header
      required: false
      description: Compteur strictement croissant par appareil (anti-rejeu).
      schema: { type: string, pattern: "^[1-9][0-9]{0,15}$" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{16,128}$"
  responses:
    WebhookReceived:
      description: Événement authentifié et enregistré (y compris un renvoi déjà reçu)
      content:
        application/json:
          schema:
            type: object
            required: [received]
            properties:
              received: { type: boolean, const: true }
    Problem:
      description: Erreur (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Habilitation, réseau ou double validation manquants (FORBIDDEN, FOUR_EYES_VIOLATION)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
      description: Code ISO 4217.
    CountryCode:
      type: string
      pattern: "^[A-Z]{2}$"
      description: Code ISO 3166-1 alpha-2.
    MinorUnits:
      type: string
      pattern: "^(0|[1-9][0-9]{0,17})$"
      description: Montant entier en unités mineures, transmis en chaîne pour éviter toute perte de précision.
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          $ref: "#/components/schemas/MinorUnits"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
    ErrorCode:
      type: string
      description: |
        Codes métier stables. Les codes LG*/TR*/PY*/KY*/AM*/BO* reprennent les
        SQLSTATE levés par la base (voir db/migrations/0001).
      enum:
        - INSUFFICIENT_FUNDS
        - UNBALANCED_JOURNAL
        - ACCOUNT_NOT_POSTABLE
        - CURRENCY_MISMATCH
        - IDEMPOTENCY_CONFLICT
        - IMMUTABLE_RECORD
        - INVALID_LEDGER_INPUT
        - INVALID_REVERSAL
        - LEDGER_CHAIN_BROKEN
        - INVALID_STATUS_TRANSITION
        - QUOTE_EXPIRED_OR_CONSUMED
        - INVALID_PAYMENT_TRANSITION
        - FOUR_EYES_VIOLATION
        - KYC_LIMIT_EXCEEDED
        - COMPLIANCE_BLOCKED
        - INVALID_CREDENTIALS
        - INVALID_VERIFICATION_CODE
        - VERIFICATION_EXPIRED
        - ACCOUNT_LOCKED
        - DEVICE_ATTESTATION_FAILED
        - DEVICE_SIGNATURE_INVALID
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - REQUEST_IN_PROGRESS
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: "#/components/schemas/ErrorCode"
        requestId:
          type: string
        issues:
          type: array
          description: Détail par champ (erreurs de validation uniquement).
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
              message:
                type: string
    OtpCode:
      type: string
      pattern: "^[0-9]{6}$"
    VerificationChallenge:
      type: object
      required: [challengeId, expiresAt]
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
    TotpCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/OtpCode" }
    DeviceRegistration:
      type: object
      additionalProperties: false
      required: [challengeId, platform, name, appVersion, osVersion, publicKey, publicKeyAlgorithm, attestation]
      properties:
        challengeId: { type: string, format: uuid }
        platform: { type: string, enum: [ios, android] }
        name: { type: string, maxLength: 80 }
        appVersion: { type: string }
        osVersion: { type: string }
        publicKey: { type: string, description: "Clé publique SPKI DER en base64 (P-256 pour ES256, Ed25519 pour EdDSA)" }
        publicKeyAlgorithm: { type: string, enum: [ES256, EdDSA] }
        attestation:
          description: |
            clientDataHash = SHA-256(défi ‖ SHA-256(clé publique SPKI)). iOS :
            attestKey(keyId, clientDataHash). Android : requestHash =
            base64url(clientDataHash).
          oneOf:
            - type: object
              required: [type, keyId, attestationObject]
              properties:
                type: { type: string, enum: [app_attest] }
                keyId: { type: string }
                attestationObject: { type: string }
            - type: object
              required: [type, integrityToken]
              properties:
                type: { type: string, enum: [play_integrity] }
                integrityToken: { type: string }
    ClientDescriptor:
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { type: string, enum: [web] }
        - type: object
          required: [type, device]
          properties:
            type: { type: string, enum: [mobile] }
            device: { $ref: "#/components/schemas/DeviceRegistration" }
        - type: object
          required: [type, deviceId]
          properties:
            type: { type: string, enum: [mobile] }
            deviceId: { type: string, format: uuid }
    AuthenticatedSession:
      type: object
      required: [status, userId, sessionId, deviceId, accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        status: { type: string, enum: [authenticated] }
        userId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        deviceId: { type: [string, "null"], format: uuid }
        accessToken: { type: string, description: "JWT at+jwt EdDSA, 10 minutes" }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string, description: "Usage unique ; à conserver dans le Keychain/Keystore (mobile) ou côté BFF (web)" }
        refreshTokenExpiresAt: { type: string, format: date-time }
    SecondFactorRequired:
      type: object
      required: [status, loginChallengeId, method, expiresAt]
      properties:
        status: { type: string, enum: [second_factor_required] }
        loginChallengeId: { type: string, format: uuid }
        method: { type: string, enum: [sms_otp, totp] }
        expiresAt: { type: string, format: date-time }
    SessionSummary:
      type: object
      required: [id, audience, createdAt, lastUsedAt, current]
      properties:
        id: { type: string, format: uuid }
        audience: { type: string, enum: [mobile, web] }
        deviceId: { type: [string, "null"] }
        deviceName: { type: [string, "null"] }
        ipAddress: { type: [string, "null"] }
        userAgent: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean }
    DeviceSummary:
      type: object
      required: [id, platform, name, createdAt, current]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [ios, android] }
        name: { type: string }
        appVersion: { type: [string, "null"] }
        osVersion: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: [string, "null"], format: date-time }
        current: { type: boolean }
    PayoutMethod:
      type: string
      enum: [bank_account, mobile_money, cash_pickup, card, wallet]
    FundingMethod:
      type: string
      enum: [wallet_balance, card, bank_transfer, mobile_money, apple_pay, google_pay]
      default: card
    AmountType:
      type: string
      description: "`send` : montant converti saisi côté envoi ; `receive` : montant à recevoir par le bénéficiaire."
      enum: [send, receive]
      default: send
    PositiveMinorUnits:
      type: string
      pattern: "^[1-9][0-9]{0,14}$"
    ExchangeRate:
      type: string
      description: Taux décimal exact (15 décimales au plus), jamais un nombre flottant.
      pattern: "^[0-9]+(\\.[0-9]{1,15})?$"
    QuoteRequest:
      type: object
      additionalProperties: false
      required: [destinationCountry, sourceCurrency, destinationCurrency, payoutMethod, amount]
      properties:
        destinationCountry: { $ref: "#/components/schemas/CountryCode" }
        sourceCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        destinationCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        payoutMethod: { $ref: "#/components/schemas/PayoutMethod" }
        fundingMethod: { $ref: "#/components/schemas/FundingMethod" }
        amount: { $ref: "#/components/schemas/PositiveMinorUnits" }
        amountType: { $ref: "#/components/schemas/AmountType" }
    Quote:
      type: object
      required: [quoteId, sourceCountry, destinationCountry, payoutMethod, fundingMethod, sendAmount, fee, totalToPay,
                 receiveAmount, exchangeRate, estimatedDeliveryMinutes, rateTimestamp, expiresAt]
      properties:
        quoteId: { type: [string, "null"], format: uuid, description: "null pour une simulation" }
        sourceCountry: { $ref: "#/components/schemas/CountryCode" }
        destinationCountry: { $ref: "#/components/schemas/CountryCode" }
        payoutMethod: { $ref: "#/components/schemas/PayoutMethod" }
        fundingMethod: { $ref: "#/components/schemas/FundingMethod" }
        sendAmount: { $ref: "#/components/schemas/Money" }
        fee: { $ref: "#/components/schemas/Money" }
        totalToPay: { $ref: "#/components/schemas/Money" }
        receiveAmount: { $ref: "#/components/schemas/Money" }
        exchangeRate: { $ref: "#/components/schemas/ExchangeRate" }
        estimatedDeliveryMinutes:
          type: [integer, "null"]
          minimum: 0
          description: Corridor le plus rapide ; null si plus aucun corridor ne sert ce devis.
        rateTimestamp: { type: [string, "null"], format: date-time, description: "Horodatage du plus ancien taux utilisé" }
        expiresAt: { type: [string, "null"], format: date-time, description: "null pour une simulation" }
    KycTier:
      type: string
      enum: [tier_0, tier_1, tier_2, tier_3]
    KycVerification:
      type: object
      required: [id, tier, provider, jobType, status, nextAction, createdAt, submittedAt, decidedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        tier: { $ref: "#/components/schemas/KycTier" }
        provider: { type: string, enum: [onfido, smile_id] }
        jobType: { type: string, enum: [document_verification, biometric_kyc, proof_of_address] }
        status:
          type: string
          enum: [created, pending_submission, submitted, in_review, approved, rejected, resubmission_required, expired]
        nextAction:
          type: [string, "null"]
          enum: [complete_capture, wait, retry, contact_support, null]
        createdAt: { type: string, format: date-time }
        submittedAt: { type: [string, "null"], format: date-time }
        decidedAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
    KycOverview:
      type: object
      required: [tier, limits, nextTier, declaredIdentity, attemptsRemaining, activeVerification, verifications]
      properties:
        tier: { $ref: "#/components/schemas/KycTier" }
        limits:
          type: object
          description: Plafonds en équivalent USD (unités mineures)
          required: [singleTransferMax, dailyMax, monthlyMax, annualMax]
          properties:
            singleTransferMax: { $ref: "#/components/schemas/Money" }
            dailyMax: { $ref: "#/components/schemas/Money" }
            monthlyMax: { $ref: "#/components/schemas/Money" }
            annualMax: { $ref: "#/components/schemas/Money" }
        nextTier: { type: [string, "null"], enum: [tier_1, tier_2, null] }
        declaredIdentity: { type: boolean }
        attemptsRemaining: { type: integer, minimum: 0 }
        activeVerification:
          oneOf:
            - $ref: "#/components/schemas/KycVerification"
            - type: "null"
        verifications:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/KycVerification" }
    StartKycVerificationRequest:
      type: object
      additionalProperties: false
      required: [tier]
      properties:
        tier: { type: string, enum: [tier_1, tier_2] }
        declaredIdentity:
          type: object
          additionalProperties: false
          required: [firstName, lastName, dateOfBirth]
          properties:
            firstName: { type: string, minLength: 1, maxLength: 100 }
            lastName: { type: string, minLength: 1, maxLength: 100 }
            dateOfBirth: { type: string, format: date }
    KycSdkLaunch:
      description: Paramètres de lancement du SDK de capture du prestataire
      oneOf:
        - type: object
          required: [provider, sdkToken, workflowRunId]
          properties:
            provider: { type: string, const: onfido }
            sdkToken: { type: string }
            workflowRunId: { type: string }
        - type: object
          required: [provider, partnerId, environment, jobId, userId, jobType, product, callbackUrl, signature, timestamp, webToken]
          properties:
            provider: { type: string, const: smile_id }
            partnerId: { type: string }
            environment: { type: string, enum: [sandbox, production] }
            jobId: { type: string, format: uuid }
            userId: { type: string, format: uuid }
            jobType: { type: integer }
            product: { type: string }
            callbackUrl: { type: string, format: uri }
            signature: { type: string }
            timestamp: { type: string, format: date-time }
            webToken: { type: [string, "null"], description: "Intégration web hébergée (session web uniquement)" }
    TransferStatus:
      type: string
      enum: [created, awaiting_funding, funding_processing, funded, compliance_review, payout_pending, payout_processing,
             completed, payout_failed, cancelled, refund_pending, refunded]
    Recipient:
      type: object
      required: [id, country, currency, payoutMethod, firstName, lastName, displayHint, mobileOperator, relationship, createdAt]
      properties:
        id: { type: string, format: uuid }
        country: { $ref: "#/components/schemas/CountryCode" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        payoutMethod: { $ref: "#/components/schemas/PayoutMethod" }
        firstName: { type: string }
        lastName: { type: string }
        displayHint: { type: string, description: "Indice non sensible (ex. « •••• 4567 · Orange Money »)" }
        mobileOperator: { type: [string, "null"] }
        relationship: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    CreateRecipientRequest:
      type: object
      additionalProperties: false
      required: [country, currency, firstName, lastName, account]
      properties:
        country: { $ref: "#/components/schemas/CountryCode" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        relationship: { type: string, enum: [family, friend, self, business, other] }
        account:
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind, msisdn, operator]
              properties:
                kind: { type: string, const: mobile_money }
                msisdn: { type: string }
                operator: { type: string, enum: [orange_money, wave, mtn_momo, moov_money, free_money, mpesa, airtel_money, vodafone_cash] }
            - type: object
              additionalProperties: false
              required: [kind]
              description: IBAN, ou numéro de compte et code banque
              properties:
                kind: { type: string, const: bank_account }
                iban: { type: string }
                accountNumber: { type: string }
                bankCode: { type: string }
            - type: object
              additionalProperties: false
              required: [kind, msisdn]
              properties:
                kind: { type: string, const: cash_pickup }
                msisdn: { type: string }
    CreateTransferRequest:
      type: object
      additionalProperties: false
      required: [quoteId, recipientId, purposeCode]
      properties:
        quoteId: { type: string, format: uuid }
        recipientId: { type: string, format: uuid }
        purposeCode:
          type: string
          enum: [family_support, education, medical_treatment, gift, household_expenses, savings, travel, other]
        totpCode: { type: string, pattern: "^\\d{6}$", description: "Session web : code de l'application d'authentification" }
    Transfer:
      type: object
      required: [id, reference, status, statusReason, recipient, sendAmount, fee, totalToPay, receiveAmount, exchangeRate,
                 fundingMethod, payoutMethod, purposeCode, createdAt, fundedAt, completedAt, cancelledAt, refundedAt]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, pattern: "^TP[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{10}$" }
        status: { $ref: "#/components/schemas/TransferStatus" }
        statusReason: { type: [string, "null"] }
        recipient:
          type: object
          required: [id, displayHint]
          properties:
            id: { type: string, format: uuid }
            displayHint: { type: string }
        sendAmount: { $ref: "#/components/schemas/Money" }
        fee: { $ref: "#/components/schemas/Money" }
        totalToPay: { $ref: "#/components/schemas/Money" }
        receiveAmount: { $ref: "#/components/schemas/Money" }
        exchangeRate: { $ref: "#/components/schemas/ExchangeRate" }
        fundingMethod: { $ref: "#/components/schemas/FundingMethod" }
        payoutMethod: { $ref: "#/components/schemas/PayoutMethod" }
        purposeCode: { type: string }
        createdAt: { type: string, format: date-time }
        fundedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        refundedAt: { type: [string, "null"], format: date-time }
    FundingAction:
      oneOf:
        - type: object
          required: [type, clientSecret, publishableKey]
          description: Paiement par carte (Stripe Payment Element)
          properties:
            type: { type: string, const: stripe_payment_intent }
            clientSecret: { type: string }
            publishableKey: { type: string }
        - type: object
          required: [type, url]
          description: Page de paiement hébergée (Flutterwave)
          properties:
            type: { type: string, const: redirect }
            url: { type: string, format: uri }
    CreatedTransfer:
      type: object
      required: [transfer, funding]
      properties:
        transfer: { $ref: "#/components/schemas/Transfer" }
        funding:
          oneOf:
            - $ref: "#/components/schemas/FundingAction"
            - type: "null"
    Wallet:
      type: object
      required: [currency, minorUnits, available, held]
      properties:
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        minorUnits: { type: integer, minimum: 0, maximum: 4 }
        available: { $ref: "#/components/schemas/Money" }
        held: { $ref: "#/components/schemas/Money" }
    StatementEntry:
      type: object
      required: [entryId, sequence, type, direction, amount, balanceAfter, description, reference, isReversal, effectiveAt]
      properties:
        entryId: { type: string }
        sequence: { type: string }
        type: { type: string }
        direction: { type: string, enum: [in, out] }
        amount: { $ref: "#/components/schemas/Money" }
        balanceAfter: { $ref: "#/components/schemas/Money" }
        description: { type: string }
        reference:
          type: [object, "null"]
          properties:
            type: { type: string }
            id: { type: string }
        isReversal: { type: boolean }
        effectiveAt: { type: string, format: date-time }
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, x, kid, alg, use]
            properties:
              kty:
                type: string
                enum: [OKP]
              crv:
                type: string
                enum: [Ed25519]
              x:
                type: string
              kid:
                type: string
              alg:
                type: string
                enum: [EdDSA]
              use:
                type: string
                enum: [sig]
    AdminTokens:
      type: object
      additionalProperties: false
      required: [accessToken, accessTokenExpiresAt, refreshToken, sessionExpiresAt]
      properties:
        accessToken: { type: string, description: "JWT aud=admin, 10 minutes" }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string, pattern: "^art_[A-Za-z0-9_-]{43}$", description: "Usage unique" }
        sessionExpiresAt: { type: string, format: date-time, description: "Expiration absolue (12 h au plus)" }
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [id, permission, actionType, targetType, targetId, payload, justification, status, requestedBy, requestedAt, decidedBy, decidedAt, decisionNote, executedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        permission: { type: string }
        actionType:
          type: string
          enum: [invite_admin, grant_roles, reactivate_admin, update_admin_network, refund_transfer, set_account_status, ledger_adjustment, reverse_journal, file_sar]
        targetType: { type: string }
        targetId: { type: string }
        payload: { type: object, description: "Contenu figé par empreinte SHA-256" }
        justification: { type: string }
        status: { type: string, enum: [pending, approved, rejected, expired, executed] }
        requestedBy: { $ref: "#/components/schemas/StaffReference" }
        requestedAt: { type: string, format: date-time }
        decidedBy: { oneOf: [{ $ref: "#/components/schemas/StaffReference" }, { type: "null" }] }
        decidedAt: { type: [string, "null"], format: date-time }
        decisionNote: { type: [string, "null"] }
        executedAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: string, format: date-time }
    StaffReference:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
