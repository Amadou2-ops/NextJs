name: platform-mobile-release

# Publication signée de l'application mobile (platform/apps/mobile) :
#   - étiquette mobile-vX.Y.Z (égale à la version de pubspec.yaml) → Android et iOS ;
#   - ou lancement manuel (choix des plateformes, de la piste Play et du statut).
# Android : AAB signé par la clé d'envoi → Google Play (piste interne par défaut).
# iOS : IPA signée (distribution App Store) → TestFlight.
# Les identifiants sont des secrets de l'environnement GitHub « mobile-release »
# (relecteurs requis conseillés) ; voir platform/apps/mobile/README.md.

on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: Plateformes à publier
        type: choice
        options: [both, android, ios]
        default: both
      play_track:
        description: Piste Google Play
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      play_release_status:
        description: Statut de la version Google Play (draft tant que l'application n'a jamais été publiée)
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: read

concurrency:
  group: platform-mobile-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version et vérifications
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      android: ${{ steps.version.outputs.android }}
      ios: ${{ steps.version.outputs.ios }}
    defaults:
      run:
        working-directory: platform/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Version publiée (pubspec.yaml) et numéro de build
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PLATFORMS: ${{ inputs.platforms || 'both' }}
          RUN_NUMBER: ${{ github.run_number }}
          BUILD_NUMBER_BASE: ${{ vars.MOBILE_BUILD_NUMBER_BASE || '0' }}
        run: |
          set -euo pipefail
          pubspec_version="$(sed -n 's/^version: *\([0-9]*\.[0-9]*\.[0-9]*\)+[0-9]*$/\1/p' pubspec.yaml)"
          if [ -z "$pubspec_version" ]; then
            echo "::error::version illisible dans pubspec.yaml (attendu X.Y.Z+N)"; exit 1
          fi
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "mobile-v$pubspec_version" ]; then
            echo "::error::étiquette $REF_NAME différente de la version de pubspec.yaml ($pubspec_version)"; exit 1
          fi
          case "$BUILD_NUMBER_BASE" in ''|*[!0-9]*) echo "::error::MOBILE_BUILD_NUMBER_BASE doit être un entier"; exit 1;; esac
          # Strictement croissant entre deux publications (exigé par Google Play et App Store Connect).
          build_number=$((BUILD_NUMBER_BASE + RUN_NUMBER))
          {
            echo "build_name=$pubspec_version"
            echo "build_number=$build_number"
            echo "android=$([ "$PLATFORMS" != ios ] && echo true || echo false)"
            echo "ios=$([ "$PLATFORMS" != android ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "Version $pubspec_version, build $build_number, plateformes : $PLATFORMS"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyse statique stricte
        run: flutter analyze --fatal-infos
      - name: Tests
        run: flutter test

  android:
    name: Android → Google Play
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: mobile-release
    defaults:
      run:
        working-directory: platform/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: platform/apps/mobile
      - name: Magasin de la clé d'envoi
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks"
      - name: Build signé et publication
        env:
          TP_BUILD_NAME: ${{ needs.prepare.outputs.build_name }}
          TP_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.play_track || 'internal' }}
          PLAY_RELEASE_STATUS: ${{ inputs.play_release_status || 'completed' }}
          API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
          PLAY_INTEGRITY_CLOUD_PROJECT: ${{ vars.PLAY_INTEGRITY_CLOUD_PROJECT }}
          SMILE_ID_PARTNER_ID: ${{ vars.SMILE_ID_PARTNER_ID }}
          SMILE_ID_SANDBOX: ${{ vars.SMILE_ID_SANDBOX }}
          SMILE_ID_AUTH_TOKEN: ${{ secrets.SMILE_ID_AUTH_TOKEN }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          LC_ALL: C.UTF-8
        run: bundle exec fastlane android internal
      - name: Symboles de déchiffrement des traces (code Dart obscurci)
        uses: actions/upload-artifact@v4
        with:
          name: symboles-android-${{ needs.prepare.outputs.build_name }}-${{ needs.prepare.outputs.build_number }}
          path: platform/apps/mobile/build/symbols/android
          retention-days: 90
          if-no-files-found: error
      - name: Effacement du magasin de clés
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties

  ios:
    name: iOS → TestFlight
    needs: prepare
    if: needs.prepare.outputs.ios == 'true'
    # Le SDK Stripe iOS actuel exige le SDK iOS 26 (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 60
    environment: mobile-release
    defaults:
      run:
        working-directory: platform/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: platform/apps/mobile
      - name: Certificat de distribution et profil App Store
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$IOS_DISTRIBUTION_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          test -s "$RUNNER_TEMP/distribution.p12"
          test -s "$RUNNER_TEMP/appstore.mobileprovision"
      - name: Build signé et envoi sur TestFlight
        env:
          TP_BUILD_NAME: ${{ needs.prepare.outputs.build_name }}
          TP_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_DISTRIBUTION_CERT_P12_PATH: ${{ runner.temp }}/distribution.p12
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_PATH: ${{ runner.temp }}/appstore.mobileprovision
          API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
          SMILE_ID_PARTNER_ID: ${{ vars.SMILE_ID_PARTNER_ID }}
          SMILE_ID_SANDBOX: ${{ vars.SMILE_ID_SANDBOX }}
          SMILE_ID_AUTH_TOKEN: ${{ secrets.SMILE_ID_AUTH_TOKEN }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          LC_ALL: en_US.UTF-8
        run: bundle exec fastlane ios beta
      - name: Symboles de déchiffrement des traces (code Dart obscurci)
        uses: actions/upload-artifact@v4
        with:
          name: symboles-ios-${{ needs.prepare.outputs.build_name }}-${{ needs.prepare.outputs.build_number }}
          path: platform/apps/mobile/build/symbols/ios
          retention-days: 90
          if-no-files-found: error
      - name: Effacement des identifiants de signature
        if: always()
        run: rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/appstore.mobileprovision"
