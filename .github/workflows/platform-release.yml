# Publication des images de production TransfertPlus.
#
# Déclenchée par une étiquette de version (v1.2.3) ou manuellement. Chaque
# image est : construite pour amd64 et arm64, publiée d'abord sous son
# empreinte de commit uniquement, analysée (Trivy : aucune vulnérabilité
# CRITIQUE ou ÉLEVÉE corrigible), signée sans clé (Sigstore/cosign, identité
# OIDC du workflow), accompagnée de sa provenance SLSA et de son SBOM — et
# seulement alors étiquetée avec la version. Une image refusée par l'analyse
# n'est jamais étiquetée.
name: platform-release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Image ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, migrate, web, admin]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/transfertplus-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nom d'image en minuscules
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - name: Construction et publication (empreinte de commit uniquement)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: platform
          file: platform/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Analyse de vulnérabilités (bloquante)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - uses: sigstore/cosign-installer@v3
      - name: Signature sans clé (Sigstore)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Attestation de provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Étiquetage de version (image analysée et signée)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${version}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Empreinte publiée
        run: echo "${{ matrix.target }} → ${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
